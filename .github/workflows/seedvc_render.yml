name: SeedVC Render

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Install client
        run: python -m pip install -q --upgrade gradio_client

      - name: Download source and reference
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o source.wav 'https://cdn-editing-temp.picsart.com/editing-temp/00c35986-42cc-472c-8fd7-9442cd7d2593.x-wav'
          curl -L --fail --retry 3 -o reference.wav 'https://cdn-editing-temp.picsart.com/editing-temp/9d41e4e1-4c80-471a-9b2a-9bc11304941b.x-wav'
          ls -lh source.wav reference.wav

      - name: Convert Slayyyter performance to Mikhail voice
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, shutil
          from gradio_client import Client, handle_file

          client = Client('Plachta/Seed-VC', verbose=True)
          info = client.view_api(return_format='dict', all_endpoints=True, print_info=False)
          print(info)

          named = info.get('named_endpoints', {}) if isinstance(info, dict) else {}
          candidates = []
          for api_name, spec in named.items():
              params = spec.get('parameters', []) if isinstance(spec, dict) else []
              print('ENDPOINT', api_name, 'PARAMS', len(params))
              if len(params) == 8:
                  candidates.append(api_name)
          for fallback in ['/predict_1', '/predict', '/voice_conversion', '/predict_2']:
              if fallback not in candidates:
                  candidates.append(fallback)

          result = None
          errors = []
          for api_name in candidates:
              try:
                  print('TRYING', api_name)
                  result = client.predict(
                      handle_file('source.wav'),
                      handle_file('reference.wav'),
                      40,
                      1.0,
                      0.7,
                      True,
                      False,
                      0,
                      api_name=api_name,
                  )
                  print('SUCCESS', api_name, result)
                  break
              except Exception as e:
                  errors.append((api_name, repr(e)))
                  print('FAILED', api_name, repr(e))
          if result is None:
              raise RuntimeError(f'No working V1 SVC endpoint: {errors}')

          items = result if isinstance(result, (tuple, list)) else [result]
          out = None
          for item in reversed(items):
              p = item.get('path') if isinstance(item, dict) else item
              if isinstance(p, str) and os.path.isfile(p):
                  out = p
                  break
          if not out:
              raise RuntimeError(f'Full WAV not found in result: {result!r}')
          shutil.copy2(out, 'MIKHAIL_SLAYYYTER_FINAL_SVC.wav')
          print('FINAL', os.path.getsize('MIKHAIL_SLAYYYTER_FINAL_SVC.wav'))
          PY

      - name: Upload final WAV
        uses: actions/upload-artifact@v4
        with:
          name: MIKHAIL-SLAYYYTER-FINAL-SVC
          path: MIKHAIL_SLAYYYTER_FINAL_SVC.wav
          compression-level: 0
          if-no-files-found: error
